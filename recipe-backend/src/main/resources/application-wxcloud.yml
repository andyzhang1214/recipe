# 微信云托管专用配置：启动时 --spring.profiles.active=wxcloud
# 环境变量由微信云托管注入：
#   PORT            云托管注入的监听端口（健康检查依赖，必须监听）
#   MYSQL_ADDRESS   MySQL 地址（host:port，云托管 MySQL 注入）
#   MYSQL_USERNAME / MYSQL_PASSWORD
#   WX_APPID / WX_SECRET        微信小程序凭据（在云托管服务-环境变量里配置）
#   RECIPE_JWT_SECRET           JWT 密钥（>=32字节）
#   ADMIN_PASSWORD              后台管理密码
#   COS_SECRET_ID/COS_SECRET_KEY/COS_BUCKET/COS_REGION  腾讯云 COS（可留空）
# 数据库：JDBC createDatabaseIfNotExist=true 自动建库，Flyway 自动建表

spring:
  datasource:
    # MYSQL_ADDRESS 形如 10.x.x.x:3306
    # 微信云托管 MySQL：账号 recipe / 密码 REPLACE_WITH_YOUR_DB_PASSWORD（云托管自动注入 MYSQL_USERNAME/MYSQL_PASSWORD，
    # 下方为本地未注入时的回退默认值）；createDatabaseIfNotExist=true 自动建库 + Flyway 自动建表
    url: jdbc:mysql://${MYSQL_ADDRESS:localhost:3306}/recipe?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:recipe}
    password: ${MYSQL_PASSWORD:REPLACE_WITH_YOUR_DB_PASSWORD}
  flyway:
    baseline-on-migrate: true
    locations: classpath:db/migration

recipe:
  jwt:
    # 必填：>= 32 字节强随机密钥，如 openssl rand -base64 48
    secret: ${RECIPE_JWT_SECRET:recipe-app-dev-jwt-secret-local-0123456789abcdef}
    expire-hours: ${RECIPE_JWT_EXPIRE_HOURS:720}
  wx:
    appid: ${WX_APPID:wx0000000000000000}
    secret: ${WX_SECRET:replace-with-your-wx-secret}
    # 生产必须禁用 demo 登录回退
    demo-login-enabled: ${WX_DEMO_LOGIN:false}
  cos:
    secret-id: ${COS_SECRET_ID:}
    secret-key: ${COS_SECRET_KEY:}
    bucket: ${COS_BUCKET:}
    region: ${COS_REGION:}
  admin:
    password: ${ADMIN_PASSWORD:admin123}
  security:
    # 内容安全：接口调用失败时放行（fail-open，微信明确判定违规仍拦截）；生产可设 false 收紧
    fail-open: ${SECURITY_FAIL_OPEN:true}
  cors:
    # 逗号分隔可信来源（小程序 wx.request 不受 CORS 限制，一般可留空）
    allowed-origins: ${RECIPE_CORS_ORIGINS:}

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never

logging:
  level:
    com.recipe: info
