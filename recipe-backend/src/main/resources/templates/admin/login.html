<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 菜谱后台</title>
  <link rel="stylesheet" th:href="@{/admin.css}">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="brand">🍳 菜谱共享 · 管理后台</div>
    <div class="sub">登录以管理菜谱、圈层与内容</div>
    <form method="post" th:action="@{/admin/login}">
      <div class="error" th:if="${error}" th:text="${error}">账号或密码错误</div>
      <div class="field">
        <label>账号</label>
        <input type="text" name="username" value="admin" autocomplete="username">
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" name="password" placeholder="默认 admin123" autocomplete="current-password">
      </div>
      <button class="login-btn" type="submit">登 录</button>
    </form>
    <div class="hint">默认账号 admin / admin123（可用环境变量 ADMIN_PASSWORD 修改）</div>
  </div>
</div>
</body>
</html>
