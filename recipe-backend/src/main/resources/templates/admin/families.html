<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: base('families', ~{::main})}">
<body>
<main>
  <div class="page-title">圈层管理</div>
  <div class="card">
    <table>
      <thead>
      <tr><th>ID</th><th>名称</th><th>成员</th><th>上限</th><th>邀请码</th><th>审批</th><th>创建人</th><th>创建时间</th><th>操作</th></tr>
      </thead>
      <tbody>
      <tr th:each="row : ${rows}">
        <td th:text="${row.family.id}">1</td>
        <td th:text="${row.family.name}">相亲相爱的一家</td>
        <td th:text="${row.family.memberCount}">2</td>
        <td th:text="${row.family.maxMembers}">99</td>
        <td class="muted" th:text="${row.family.joinCode}">FAM-XXXX</td>
        <td th:text="${row.family.approvalRequired} ? '需审批' : '免审批'">需审批</td>
        <td th:text="${row.owner}">Andy</td>
        <td class="muted" th:text="${row.family.createdAt != null} ? ${#temporals.format(row.family.createdAt, 'MM-dd HH:mm')} : '—'">08-18 10:00</td>
        <td><button class="btn danger sm" th:attr="data-id=${row.family.id}" onclick="del(this)">删除</button></td>
      </tr>
      </tbody>
    </table>
    <div class="empty-tip" th:if="${#lists.isEmpty(rows)}">暂无圈层</div>
    <div class="pager">
      <a th:if="${page.current > 1}" th:href="@{/admin/families(page=${page.current - 1})}">上一页</a>
      <span class="cur" th:text="${page.current}">1</span>
      <a th:if="${page.current < page.pages}" th:href="@{/admin/families(page=${page.current + 1})}">下一页</a>
      <span th:text="'共 ' + ${page.total} + ' 条'">共 0 条</span>
    </div>
  </div>
</main>
<script>
  function del(btn) {
    if (!confirm('删除圈层不可恢复，确认？')) return;
    fetch('/admin/api/families/' + btn.dataset.id, { method: 'DELETE' })
      .then(r => r.json()).then(res => {
        if (res.code === 0) location.reload();
        else alert(res.message || '操作失败');
      });
  }
</script>
</body>
</html>
