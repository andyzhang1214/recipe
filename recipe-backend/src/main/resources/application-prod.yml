# 生产环境配置：启动时加 --spring.profiles.active=prod
# 敏感信息一律从环境变量注入，禁止明文提交；缺失即启动失败/功能降级拦截。

spring:
  flyway:
    baseline-on-migrate: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

recipe:
  jwt:
    # 必填：>= 32 字节强随机密钥（如 openssl rand -base64 48）
    secret: ${RECIPE_JWT_SECRET}
    expire-hours: ${RECIPE_JWT_EXPIRE_HOURS:72}
  wx:
    appid: ${WX_APPID}
    secret: ${WX_SECRET}
    # 生产必须禁用 demo 登录回退
    demo-login-enabled: false
  cos:
    secret-id: ${COS_SECRET_ID}
    secret-key: ${COS_SECRET_KEY}
    bucket: ${COS_BUCKET}
    region: ${COS_REGION}
  admin:
    # 必填：后台管理密码
    password: ${ADMIN_PASSWORD}
  security:
    # 内容安全：微信接口调用失败时拦截（fail-closed），而非放行
    fail-open: false
  cors:
    # 逗号分隔的可信来源，如 https://你的域名
    allowed-origins: ${RECIPE_CORS_ORIGINS}

logging:
  level:
    com.recipe: info

server:
  error:
    include-stacktrace: never
