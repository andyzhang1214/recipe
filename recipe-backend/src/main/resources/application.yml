server:
  # 微信云托管会注入 PORT 环境变量（健康检查端口），本地无注入时默认 8080
  port: ${PORT:8080}

spring:
  application:
    name: recipe-backend
  datasource:
    url: jdbc:mysql://localhost:3306/recipe?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

recipe:
  jwt:
    # 生产环境务必通过环境变量 RECIPE_JWT_SECRET 注入 >= 32 字节强随机密钥（HS256）
    secret: ${RECIPE_JWT_SECRET:recipe-app-dev-jwt-secret-local-0123456789abcdef}
    expire-hours: 720
  # 微信小程序配置（生产用 WX_APPID / WX_SECRET 环境变量）
  wx:
    appid: wx0000000000000000
    secret: replace-with-your-wx-secret
    # 本地联调允许 demo 登录回退；生产（application-prod.yml）强制 false
    demo-login-enabled: true
  # 腾讯云 COS（图片直传预签名；未配置时上传接口返回提示，其余功能不受影响）
  cos:
    secret-id: ""
    secret-key: ""
    bucket: ""            # 如 recipe-images-1250000000
    region: ""            # 如 ap-shanghai
  # 后台管理密码（生产用环境变量 ADMIN_PASSWORD 覆盖）
  admin:
    password: admin123
  # 内容安全：微信接口调用失败时是否放行（true=放行，false=拦截）
  # 默认放行：接口出错（开放接口服务未开启/网络异常）不应阻断所有发布；
  # 微信明确判定违规（87014 / risky）时无论该值如何都会拦截。生产可改 false 收紧
  security:
    fail-open: true
  # 跨域可信来源（逗号分隔；默认本机开发地址）
  cors:
    allowed-origins: ""

logging:
  level:
    com.recipe: info
